name: linked-ministries
# Every test, on a fresh Postgres 16 and a real Chromium, before anything is deployed. Railway's "Wait for CI" (Settings, Source)
# makes it ship only a commit that is green.
on:
  push:
    branches: ["**"]
  pull_request:
permissions:
  contents: read
concurrency:
  group: linked-ministries-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: unit, plain words, database, API, boot, light, browser
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_PASSWORD: lexos-local }
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      LEXOS_PG_ADMIN_URL: postgres://postgres:lexos-local@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with: { node-version: 22 }
      - name: Install (lockfile only)
        run: npm ci --no-audit --no-fund
      - name: Dependency audit, the packages that ship, moderate and above
        run: npm audit --omit=dev --audit-level=moderate
      - name: A browser
        run: |
          npx playwright-core install --with-deps chromium
          echo "CHROMIUM_PATH=$(node -p "require('playwright-core').chromium.executablePath()")" >> "$GITHUB_ENV"
      - name: Every test
        run: npm test
